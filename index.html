
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMW Open World 2K Ultimate</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#79cafa}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:white}
.top{
 position:absolute;top:10px;left:10px;
 background:#071b30dd;padding:12px 16px;
 border-radius:12px;font-weight:bold
}
#stats{
 position:absolute;top:65px;left:10px;
 background:#071b30bb;padding:9px;
 border-radius:9px;font-size:12px
}
.controls{
 position:absolute;bottom:15px;left:10px;
 display:flex;gap:6px;pointer-events:auto
}
.right{
 position:absolute;right:10px;bottom:15px;
 display:flex;flex-direction:column;gap:6px;
 pointer-events:auto
}
button{
 background:#071b30dd;color:white;
 border:1px solid #ffffff77;
 border-radius:10px;padding:12px;
 font-weight:bold;cursor:pointer;
 touch-action:none;font-size:12px
}
button:active{background:#087cda}
#notice{
 position:absolute;top:15%;left:50%;
 transform:translateX(-50%);
 background:#071b30dd;padding:10px 16px;
 border-radius:10px;display:none
}
#cross{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 font-size:22px;color:white;opacity:.5
}
#help{
 position:absolute;left:10px;top:115px;
 font-size:11px;background:#071b30aa;
 padding:8px;border-radius:8px
}
@media(max-width:600px){
 button{padding:10px;font-size:11px}
 .controls{bottom:12px}
 .right{bottom:12px}
}
</style>
</head>
<body>
<div id="ui">
 <div class="top">🏎️ BMW OPEN WORLD 2K</div>
 <div id="stats">Vehicle: BMW | NPCs: 0 | Tool: Paint</div>
 <div id="help">
  WASD: Move / Drive<br>
  SPACE: Jump<br>
  E: Enter / Exit vehicle<br>
  F: Use selected tool
 </div>
 <div id="cross">+</div>
 <div id="notice"></div>

 <div class="controls">
  <button id="left">◀</button>
  <button id="forward">▲</button>
  <button id="back">▼</button>
  <button id="rightBtn">▶</button>
 </div>

 <div class="right">
  <button onclick="enterExit()">🚗 ENTER / EXIT</button>
  <button onclick="switchVehicle()">🏎️ CAR / BIKE</button>
  <button onclick="changeColor()">🎨 CAR COLOR</button>
  <button onclick="jump()">⬆ JUMP</button>
  <button onclick="changeCamera()">📷 CAMERA</button>
  <button onclick="changeTool()">🫧 CHANGE TOOL</button>
  <button onclick="useTool()">✨ USE TOOL</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){
 document.body.innerHTML="Three.js could not load. Please check your internet connection.";
 throw new Error("Three.js unavailable");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x79cafa);
scene.fog=new THREE.Fog(0x79cafa,100,500);

const camera=new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,.1,1500
);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x558844,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,100,50);
sun.castShadow=true;
scene.add(sun);

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1200,1200),
 new THREE.MeshStandardMaterial({color:0x37a735})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Roads
function road(x,z,w,h){
 const r=new THREE.Mesh(
  new THREE.PlaneGeometry(w,h),
  new THREE.MeshStandardMaterial({color:0x30343a})
 );
 r.rotation.x=-Math.PI/2;
 r.position.set(x,.04,z);
 scene.add(r);
}
road(0,0,18,1200);
road(0,0,1200,18);

for(let i=-570;i<=570;i+=30){
 road(i,0,1,1200);
 road(0,i,1200,1);
}

// Buildings
for(let i=0;i<160;i++){
 let x=(Math.random()-.5)*1000;
 let z=(Math.random()-.5)*1000;
 if(Math.abs(x)<22||Math.abs(z)<22)continue;
 let h=10+Math.random()*35;
 const b=new THREE.Mesh(
  new THREE.BoxGeometry(12,h,12),
  new THREE.MeshStandardMaterial({
   color:[0xc4d4e3,0xaaaaaa,0xd5c6ad,0x778899][i%4]
  })
 );
 b.position.set(x,h/2,z);
 b.castShadow=true;
 scene.add(b);
}

// Trees
function tree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.5,.7,5,8),
  new THREE.MeshStandardMaterial({color:0x754321})
 );
 trunk.position.set(x,2.5,z);
 scene.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(3.5,10,10),
  new THREE.MeshStandardMaterial({color:0x087c24})
 );
 leaves.position.set(x,7,z);
 scene.add(leaves);
}
for(let i=0;i<400;i++){
 let x=(Math.random()-.5)*1000;
 let z=(Math.random()-.5)*1000;
 if(Math.abs(x)<13||Math.abs(z)<13)continue;
 tree(x,z);
}

// BMW / Bike
const vehicle=new THREE.Group();
scene.add(vehicle);
let wheels=[];
let vehicleType="car";
let carColor=0xe50020;

function makeCar(){
 vehicle.clear();
 wheels=[];
 const body=new THREE.Mesh(
  new THREE.BoxGeometry(3.3,1,6),
  new THREE.MeshStandardMaterial({
   color:carColor,metalness:.5,roughness:.3
  })
 );
 body.position.y=1.1;
 vehicle.add(body);

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,.9,2.8),
  new THREE.MeshStandardMaterial({color:0x151c26})
 );
 roof.position.set(0,2,-.3);
 vehicle.add(roof);

 const glass=new THREE.Mesh(
  new THREE.BoxGeometry(2.35,.65,2.5),
  new THREE.MeshStandardMaterial({color:0x75cce9})
 );
 glass.position.set(0,2.05,-.3);
 vehicle.add(glass);

 for(let x of [-1.7,1.7]){
  for(let z of [-2,2]){
   const w=new THREE.Mesh(
    new THREE.CylinderGeometry(.65,.65,.4,20),
    new THREE.MeshStandardMaterial({color:0x111111})
   );
   w.rotation.z=Math.PI/2;
   w.position.set(x,.65,z);
   vehicle.add(w);
   wheels.push(w);
  }
 }
}
function makeBike(){
 vehicle.clear();
 wheels=[];
 const mat=new THREE.MeshStandardMaterial({color:0x111111});
 for(let z of [-1.3,1.3]){
  const w=new THREE.Mesh(
   new THREE.TorusGeometry(.55,.12,8,20),mat
  );
  w.rotation.y=Math.PI/2;
  w.position.set(0,.65,z);
  vehicle.add(w);
  wheels.push(w);
 }
 const frame=new THREE.Mesh(
  new THREE.BoxGeometry(.4,.5,1.6),
  new THREE.MeshStandardMaterial({color:0x00aaff})
 );
 frame.position.y=1;
 vehicle.add(frame);
 const seat=new THREE.Mesh(
  new THREE.BoxGeometry(.7,.2,.8),
  mat
 );
 seat.position.set(0,1.4,-.3);
 vehicle.add(seat);
}
makeCar();

// Player character
const player=new THREE.Group();
scene.add(player);

function makePerson(group,color=0x1475d4){
 const skin=new THREE.MeshStandardMaterial({color:0xd9a078});
 const shirt=new THREE.MeshStandardMaterial({color});
 const pants=new THREE.MeshStandardMaterial({color:0x202020});
 const hat=new THREE.MeshStandardMaterial({color:0x222222});

 function part(g,m,x,y,z){
  const o=new THREE.Mesh(g,m);
  o.position.set(x,y,z);
  group.add(o);
  return o;
 }

 part(new THREE.SphereGeometry(.4,12,12),skin,0,2.5,0);
 part(new THREE.CylinderGeometry(.43,.43,.15,12),hat,0,2.9,0);
 part(new THREE.BoxGeometry(.9,1.2,.5),shirt,0,1.5,0);

 const arms=[];
 for(let x of [-.65,.65]){
  arms.push(part(new THREE.BoxGeometry(.25,.9,.25),skin,x,1.5,0));
 }
 const legs=[];
 for(let x of [-.25,.25]){
  legs.push(part(new THREE.BoxGeometry(.32,1,.35),pants,x,.5,0));
 }
 return {arms,legs};
}
const playerParts=makePerson(player);
let inVehicle=true;
let playerJump=0;
let playerY=0;

// NPCs
const npcs=[];
const npcColors=[0xf1a53a,0xc65bdb,0xe2e2e2,0x27a8a0,0xd65a55];

function makeNPC(x,z){
 const group=new THREE.Group();
 const color=npcColors[Math.floor(Math.random()*npcColors.length)];
 const parts=makePerson(group,color);
 group.position.set(x,0,z);
 scene.add(group);

 npcs.push({
  group,parts,
  angle:Math.random()*Math.PI*2,
  speed:.025+Math.random()*.025,
  timer:Math.random()*150,
  active:true,
  flash:0
 });
}
for(let i=0;i<35;i++){
 let x=(Math.random()-.5)*500;
 let z=(Math.random()-.5)*500;
 if(Math.abs(x)<20||Math.abs(z)<20){x+=35;z+=35}
 makeNPC(x,z);
}

// Driver appearance inside vehicle
const driver=new THREE.Group();
const driverParts=makePerson(driver,0x202020);
driver.scale.set(.65,.65,.65);
driver.position.set(0,0,-.2);
vehicle.add(driver);

// Movement
let keys={};
let velocityY=0;
let onGround=true;
let speed=0;
let angle=0;
let cameraMode=0;
let paint=false;
let toolIndex=0;
let lastShot=0;

const tools=[
 {name:"Paint Blaster",color:0xff33bb},
 {name:"Water Blaster",color:0x33ccff},
 {name:"Bubble Launcher",color:0xbaffee},
 {name:"Rainbow Blaster",color:0xffff33}
];

window.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="Space")jump();
 if(e.code==="KeyE")enterExit();
 if(e.code==="KeyF")useTool();
});
window.addEventListener("keyup",e=>keys[e.code]=false);

function bindButton(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  el.addEventListener(ev,()=>keys[key]=false);
 });
}
bindButton("left","KeyA");
bindButton("rightBtn","KeyD");
bindButton("forward","KeyW");
bindButton("back","KeyS");

function message(t){
 const n=document.getElementById("notice");
 n.textContent=t;
 n.style.display="block";
 clearTimeout(message.timer);
 message.timer=setTimeout(()=>n.style.display="none",1800);
}

function enterExit(){
 inVehicle=!inVehicle;
 speed=0;
 if(inVehicle){
  player.visible=false;
  driver.visible=true;
  message("You entered the vehicle!");
 }else{
  player.visible=true;
  driver.visible=false;
  player.position.set(
   vehicle.position.x+3,
   0,
   vehicle.position.z
  );
  message("You exited the vehicle!");
 }
}
function switchVehicle(){
 vehicleType=vehicleType==="car"?"bike":"car";
 if(vehicleType==="car")makeCar();
 else makeBike();
 vehicle.add(driver);
 driver.visible=inVehicle;
 message(vehicleType==="car"?"BMW selected":"Bike selected");
}
function changeColor(){
 const colors=[0xe50020,0x0755ff,0x55ccff,0x159c40];
 carColor=colors[(colors.indexOf(carColor)+1)%colors.length];
 if(vehicleType==="car"){
  makeCar();
  vehicle.add(driver);
  driver.visible=inVehicle;
 }
 message("Car color changed!");
}
function jump(){
 if(onGround){
  velocityY=.28;
  onGround=false;
 }
}
function changeCamera(){
 cameraMode=(cameraMode+1)%3;
 message("Camera mode "+(cameraMode+1));
}
function changeTool(){
 toolIndex=(toolIndex+1)%tools.length;
 message("Selected: "+tools[toolIndex].name);
}

function useTool(){
 const now=performance.now();
 if(now-lastShot<350)return;
 lastShot=now;

 const color=tools[toolIndex].color;
 const ball=new THREE.Mesh(
  new THREE.SphereGeometry(.3,12,12),
  new THREE.MeshStandardMaterial({
   color,emissive:color,emissiveIntensity:.25
  })
 );

 let start;
 if(inVehicle){
  start=vehicle.position.clone();
  start.y+=2;
 }else{
  start=player.position.clone();
  start.y+=2;
 }
 ball.position.copy(start);

 const direction=new THREE.Vector3(
  -Math.sin(angle),0,-Math.cos(angle)
 );
 scene.add(ball);

 const target=start.clone().add(direction.multiplyScalar(60));
 const duration=500;
 const begin=performance.now();

 function moveBall(){
  const t=Math.min((performance.now()-begin)/duration,1);
  ball.position.lerpVectors(start,target,t);
  if(t<1){
   requestAnimationFrame(moveBall);
  }else{
   // Tag nearby NPCs with a colorful effect.
   for(const npc of npcs){
    if(!npc.active)continue;
    if(npc.group.position.distanceTo(ball.position)<4){
     tagNPC(npc,color);
    }
   }
   scene.remove(ball);
  }
 }
 moveBall();
}

function tagNPC(npc,color){
 if(!npc.active)return;
 npc.active=false;
 npc.group.visible=false;
 message("NPC tagged with "+tools[toolIndex].name+"!");
 setTimeout(()=>{
  npc.group.position.set(
   vehicle.position.x+(Math.random()-.5)*100,
   0,
   vehicle.position.z+(Math.random()-.5)*100
  );
  npc.group.visible=true;
  npc.active=true;
  npc.angle=Math.random()*Math.PI*2;
 },3000);
}

// Main loop
let paintCooldown=0;
let lastTime=performance.now();

function animate(){
 requestAnimationFrame(animate);

 const now=performance.now();
 const dt=Math.min((now-lastTime)/16.67,2);
 lastTime=now;

 const forward=keys.KeyW||keys.ArrowUp;
 const backward=keys.KeyS||keys.ArrowDown;
 const left=keys.KeyA||keys.ArrowLeft;
 const right=keys.KeyD||keys.ArrowRight;

 if(inVehicle){
  if(left)angle+=.035*dt;
  if(right)angle-=.035*dt;

  if(forward)speed=Math.min(speed+.008*dt,.5);
  else if(backward)speed=Math.max(speed-.008*dt,-.3);
  else speed*=Math.pow(.96,dt);

  vehicle.rotation.y=angle;
  vehicle.position.x-=Math.sin(angle)*speed*dt;
  vehicle.position.z-=Math.cos(angle)*speed*dt;

  player.visible=false;
  driver.visible=true;
 }else{
  speed=0;
  let move=0;
  if(forward)move=.14*dt;
  if(backward)move=-.14*dt;
  if(left)angle+=.045*dt;
  if(right)angle-=.045*dt;

  player.rotation.y=angle;
  player.position.x-=Math.sin(angle)*move;
  player.position.z-=Math.cos(angle)*move;

  velocityY-=.012*dt;
  playerY+=velocityY*dt;
  if(playerY<0){
   playerY=0;
   velocityY=0;
   onGround=true;
  }
  player.position.y=playerY;

  playerParts.legs.forEach((l,i)=>{
   l.rotation.x=move!==0?Math.sin(now*.012+i*Math.PI)*.5:0;
  });
  playerParts.arms.forEach((a,i)=>{
   a.rotation.x=move!==0?Math.sin(now*.012+i*Math.PI)*.35:0;
  });
 }

 // Vehicle vertical position
 if(inVehicle){
  velocityY-=.012*dt;
  vehicle.position.y+=velocityY*dt;
  if(vehicle.position.y<0){
   vehicle.position.y=0;
   velocityY=0;
   onGround=true;
  }
 }

 wheels.forEach(w=>w.rotation.x-=speed*.1*dt);

 // NPC movement and avoidance
 for(const npc of npcs){
  if(!npc.active)continue;
  const p=npc.group.position;
  npc.timer-=dt;

  if(npc.timer<=0){
   npc.angle+=(Math.random()-.5)*1.5;
   npc.timer=80+Math.random()*150;
  }

  let dx=p.x-vehicle.position.x;
  let dz=p.z-vehicle.position.z;
  let dist=Math.hypot(dx,dz);

  if(dist<13){
   npc.angle=Math.atan2(dx,dz);
   npc.speed=.10;
  }else{
   npc.speed=.035;
  }

  p.x+=Math.sin(npc.angle)*npc.speed*dt;
  p.z+=Math.cos(npc.angle)*npc.speed*dt;
  npc.group.rotation.y=npc.angle;

  npc.parts.legs.forEach((l,i)=>{
   l.rotation.x=Math.sin(now*.01+i*Math.PI)*.45;
  });

  // Non-graphic vehicle collision reaction:
  if(inVehicle&&dist<3.5&&Math.abs(speed)>.12){
   npc.angle+=Math.PI;
   npc.speed=.15;
   message("NPC moved away from your vehicle!");
  }
 }

 // Camera
 let distance=cameraMode===0?13:cameraMode===1?24:5;
 let focus=inVehicle?vehicle.position:player.position;

 const target=new THREE.Vector3(
  focus.x+Math.sin(angle)*distance,
  focus.y+6,
  focus.z+Math.cos(angle)*distance
 );
 camera.position.lerp(target,.09);
 camera.lookAt(focus.x,focus.y+1,focus.z);

 document.getElementById("stats").textContent=
  "Vehicle: "+vehicleType.toUpperCase()+
  " | NPCs: "+npcs.filter(n=>n.active).length+
  " | Tool: "+tools[toolIndex].name;

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
